name: ESP-IDF Build

on:
  push:
    branches: [main, dev, V0.0.1]
    paths:
      - 'auris/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'auris/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with ESP-IDF
        working-directory: auris
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            auris/build/*.bin
            auris/build/*.elf
            auris/build/*.map
            auris/build/bootloader/*.bin
            auris/build/partition_table/*.bin
          retention-days: 30
